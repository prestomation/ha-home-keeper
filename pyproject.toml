[project]
name = "home_keeper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Babel>=2.18.0"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "requests>=2.34.2"]

# Make the integration pip-installable straight from git (no PyPI publish needed),
# so other integrations can depend on it in their test suite and import
# ``home_keeper.testing``. Home Assistant itself loads the integration from
# ``custom_components/`` and ignores this packaging metadata.
#   pip install "home-keeper @ git+https://github.com/prestomation/ha-home-keeper@main"
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["custom_components"]
include = ["home_keeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Make `from asserts import raises_exactly` (tests/unit/asserts.py) resolve
# explicitly. Without it the import works only by accident — pytest's default
# import mode puts each test file's own directory on sys.path, so it would break
# the moment a unit test moved into a subdirectory. This adds no *source* path,
# so it doesn't affect how mutmut derives a mutant's module name.
pythonpath = ["tests/unit"]
markers = [
    "real_ha: marks tests that use real HA modules (not mocked)",
    "property: property-based test; needs hypothesis, skips without it",
]

[tool.coverage.run]
branch = true
source = ["custom_components/home_keeper"]
relative_files = true
# testing.py is a test-support helper for *other* integrations (exercised by their
# suites, not Home Keeper's own), so it shouldn't count toward product coverage.
omit = ["custom_components/home_keeper/testing.py"]

[tool.coverage.report]
show_missing = true

# Mutation testing (ci/test-mutation-python.sh). Coverage says a line ran;
# mutation testing says a test would have *failed* if that line were wrong.
[tool.mutmut]
source_paths = ["custom_components/home_keeper"]
# mutmut runs the suite inside a `mutants/` copy that holds only the source paths
# and the tests. `tests/unit/test_ci_check_ha_version.py` loads `ci/check-ha-version.py`
# by path (the hyphen makes it unimportable), so without this the whole run dies at
# stat collection — never noticed, because the two PRs since that test landed changed
# no mutable Python and mutmut was skipped. `tests/unit/test_release_issues.py` reads
# CHANGELOG.md at *import* time (its parametrize enumerates released versions), which
# is the same trap: it went in with a PR that changed no mutable Python, so the run
# that would have caught it never happened. A test that reads a repo file needs that
# file listed here.
# ``test_generate_api_docs.py`` reads ``website/scripts/doc-map.mjs`` to check the
# generated page's frontmatter against the route it is published at — the same
# reads-a-repo-file trap as the two above, and it stayed hidden for the same
# reason: no PR touching mutable Python had run since that assertion landed. It is
# listed as its directory because mutmut ``copy2``s a bare file without creating
# its parent, and only ``copytree``s a directory into place.
# ``test_service_text.py`` reads ``docs/INTEGRATING.md`` to check what it says about
# ``update_task`` (B02-5), so ``docs`` is listed too, as its directory.
# ``test_ci_release_publish_gate.py`` reads ``.github/workflows/release.yml`` to run
# the release workflow's publish decision (X06-2), so that directory is listed too.
also_copy = ["ci", "CHANGELOG.md", "website/scripts", "docs", ".github/workflows"]
# The mutable surface: the pure core, which the fast `tests/unit` tier covers
# directly. Everything else in the integration imports Home Assistant and is
# only exercised by the Docker tiers — far too slow to run once per mutant, and
# scoring it here would just report noise. Also excluded: const.py,
# companions_catalog.py and api_surface.py (data, not logic — api_surface is a
# declarative index of the integration's surfaces, pinned by
# tests/unit/test_api_surface.py against the real registrations rather than by
# behavioural assertions), backend_i18n.py (pure but with no unit-test entry
# point) and testing.py (a helper for *other* integrations' suites, already
# omitted from coverage).
only_mutate = [
    "custom_components/home_keeper/recurrence.py",
    "custom_components/home_keeper/models.py",
    "custom_components/home_keeper/assets.py",
    "custom_components/home_keeper/reconcile.py",
    "custom_components/home_keeper/todo_items.py",
    "custom_components/home_keeper/shopping.py",
    "custom_components/home_keeper/notifications.py",
    "custom_components/home_keeper/sensor_tasks.py",
    # Aggregate profile / all-tasks counts behind the count sensors. Pure and driven
    # by tests/unit/test_task_counts.py; sensor.py is a thin publisher over it.
    "custom_components/home_keeper/task_counts.py",
    "custom_components/home_keeper/problem_tasks.py",
    "custom_components/home_keeper/appliance_report.py",
    "custom_components/home_keeper/profiles.py",
    "custom_components/home_keeper/documents.py",
    # Task photos (#399): the list rules and the on-disk paths. Pure, and driven by
    # tests/unit/test_task_photos.py.
    "custom_components/home_keeper/task_photos.py",
    "custom_components/home_keeper/events.py",
    "custom_components/home_keeper/transitions.py",
    "custom_components/home_keeper/tags.py",
    "custom_components/home_keeper/card_resource.py",
    "custom_components/home_keeper/resolve.py",
    "custom_components/home_keeper/todo_list.py",
    # The import/export document: what travels, the primary-key ladder, and the
    # chronological history fold. Pure, and covered by the three tests/unit/test_transfer*
    # files — the round-trip one is what keeps a newly added field travelling.
    "custom_components/home_keeper/transfer.py",
    # Imports Home Assistant only under ``TYPE_CHECKING``, so the fast unit tier runs
    # it directly (tests/unit/test_options.py) — see "Pure, HA-free core".
    "custom_components/home_keeper/options.py",
    # Declarative-companion logic: spec normalization, selection/expansion,
    # and the reconcile diff. Pure and covered by tests/unit/test_declarative_companions.py.
    # The HA-bound reconciler that wires it up (``declarative_companion_sync.py``) is
    # not on this list — same rule as the other HA-importing modules.
    "custom_components/home_keeper/declarative_companions.py",
    # Per-task entity names and the entity-set key that decides an entry reload.
    # Pure and covered by tests/unit/test_task_entities.py.
    "custom_components/home_keeper/task_entities.py",
    # Also TYPE_CHECKING-only, and driven by tests/unit/test_device_compat.py: the two
    # device-registry shapes it reconciles are only distinguishable by behaviour, so a
    # mutant that iterates the wrong one has to be caught by an assertion.
    "custom_components/home_keeper/device_compat.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.mutation-gate]
# Minimum mutation score, in percent, for both languages. The TypeScript side
# reads its copy from `thresholds.break` in stryker.conf.json — keep them equal;
# ci/mutation_report.py fails the run if they drift.
break = 80

# ci/docs.py: the docs CLI and the docs gate (lint.yml, `docs-audit`). A doc's kind
# comes from the first glob here that matches its path; `strip` is cut from the path
# to make the doc id. A kind with no cap (the user guide) gets only the link check.
[tool.docs-audit]
line_width = 100
max_exceptions = 2
duplicate_min_words = 12
# Every file here must be in at least one design doc's `implements`.
coverage = [
    "custom_components/home_keeper/*.py",
    "custom_components/home_keeper/frontend/src/**/*.ts",
]
uncovered = []
link_scan = ["**/*.md"]
link_skip = ["CHANGELOG.md", "**/node_modules/**", "website/docs/guide/**", "website/developer/**"]
# Where a backticked file or `module.func` reference may live.
code_dirs = [
    "custom_components/home_keeper",
    "custom_components/home_keeper/frontend/src",
    "custom_components/home_keeper/frontend",
    "ci",
    "tests",
    "docs",
    "website/scripts",
]
code_ref_ignore = ["**/dist/**", "dist/**", "docs/videos/**"]
# Files whose text is searched for a `docs/...md` path that must exist.
# Test fixtures name docs that do not exist on purpose.
doc_ref_skip = ["tests/frontend/**", "tests/unit/test_docs_cli.py"]
doc_ref_suffixes = [".py", ".ts", ".js", ".mjs", ".md", ".yml", ".yaml", ".toml", ".sh", ".ini", ".json"]
budgets = [{ files = ["CLAUDE.md", "AGENTS.md"], max_lines = 250 }]
kinds = [
    { glob = "docs/design/*.md", kind = "design", strip = "docs/design/" },
    { glob = "docs/guide/**/*.md", kind = "guide", strip = "docs/" },
    { glob = "docs/*.md", kind = "reference", strip = "docs/" },
    { glob = ".amazonq/rules/*.md", kind = "rules", strip = ".amazonq/" },
    { glob = ".claude/skills/**/*.md", kind = "skill", strip = ".claude/skills/" },
    { glob = "AGENTS.md", kind = "process" },
    { glob = "CLAUDE.md", kind = "process" },
    { glob = "RELEASE.md", kind = "process" },
    { glob = "website/README.md", kind = "process" },
    { glob = "IDEAS.md", kind = "backlog" },
]

[tool.docs-audit.caps]
design = 150
reference = 300
rules = 200
process = 200
backlog = 300
skill = 200

# Text that tells history instead of the current design. Prose only; code spans and
# fences are not checked.
[tool.docs-audit.history]
all = [
    '(?i)\bthis PR\b',
    '\bPR #\d+',
    '(?i)\boriginally\b',
    '(?i)\bpreviously\b',
    '(?i)\bwe first\b',
    '(?i)\bused to be\b',
    '(?i)\bhistorically\b',
    '\bPhase \d',
    'Status:',
    '(?i)\bwritten (in )?(january|february|march|april|may|june|july|august|september|october|november|december) \d{4}',
]
design = ['(?<![\w/&-])#\d{2,}\b']

# Strict typing is a Platinum quality-scale gate (see custom_components/home_keeper/
# quality_scale.yaml). CI runs `mypy custom_components/home_keeper` with Home
# Assistant installed so HA's own types resolve; keep the integration error-free.
[tool.mypy]
# Tracks the Python floor Home Assistant itself requires, not the integration's.
# HA's source uses syntax from its own minimum Python — 2026.3 raised the floor to
# 3.14.2, and 2026.8 uses PEP 758 parenthesis-free `except A, B:` — which mypy
# cannot even *parse* when targeting an older version. It bails with a syntax error
# inside HA and reports nothing about our code, so this silently stops being a gate.
python_version = "3.14"
# Home Assistant 2026.10 types its schema arguments with probatio, the engine it
# aliases `voluptuous` to at runtime since 2026.9. hass-nabucasa still installs the
# real voluptuous, so without this mypy reads our `import voluptuous as vol` as a
# different class and rejects every schema we pass in (#417). The stubs in
# `typings/` point `voluptuous` at probatio for mypy only, as Home Assistant core's
# `stubs/voluptuous` does. Remove them when the code imports probatio directly.
mypy_path = "typings"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    # Third-party integrations staged by ci/fetch-glues.sh for the upgrade suite.
    # Gitignored, not ours to lint or format.
    "tests/upgrade/custom_components",
]

[tool.ruff.lint]
# Pragmatic-but-meaningful set: pyflakes/pycodestyle, import sorting, pyupgrade,
# bugbear, comprehensions, simplify, and Ruff's own rules.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# The multiplication sign is a deliberate typographic choice, not a stray homoglyph:
# it is how a buy reminder tells the shopper to pick up more than one ("Buy filter
# (×2)"), and "x2" reads as part of the product name. Confusables stay flagged
# everywhere else.
allowed-confusables = ["×"]

[tool.ruff.lint.isort]
known-third-party = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
# Tests favour explicit loops / try-except over these "simplify" suggestions.
"tests/**" = ["SIM105", "SIM113"]
