# Lovelace dashboard for the Playwright e2e suite — the "usage" surfaces.
# Renders the Home Keeper task card alongside the native to-do list and calendar
# so browser tests can assert on real DOM and screenshots can show how tasks
# appear to users.
title: Home Keeper E2E
views:
  - title: Tasks
    path: card
    cards:
      # Default card: every enabled task, soonest-due first.
      - type: custom:home-keeper-card
        title: Home maintenance
      # A configured card: grouped into status sections with notes shown —
      # exercises the grouping/display options and adds screenshot variety.
      - type: custom:home-keeper-card
        title: By status
        group_by: status
        show_notes: true
      # A subject card: only tasks carrying the "dog" label (directly, or via a
      # labelled device/area), with each task's label chips shown. Exercises the
      # label filter and the show_labels display option.
      - type: custom:home-keeper-card
        title: Dog
        labels:
          - dog
        show_labels: true
      # Both to-do cards carry an explicit title: there are two of them now, and
      # the card renders no heading of its own, so the title is what tells a test
      # (and a reader of the screenshots) which list is which.
      - type: todo-list
        title: Home Keeper tasks
        entity: todo.home_keeper_tasks
      # The household's own shopping list, which the buy-reminder mirror writes
      # onto when it is pointed at it. Here so a browser test can see what the
      # shopper sees, rather than only what the service API reports.
      - type: todo-list
        title: Shopping list
        entity: todo.shopping_list
      - type: calendar
        entities:
          - calendar.home_keeper_upcoming_tasks
