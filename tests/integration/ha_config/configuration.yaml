homeassistant:
  name: Test Home
  unit_system: imperial
  time_zone: America/New_York
  latitude: 40.7128
  longitude: -74.0060
  elevation: 10

# Enable the REST API
api:

# Enable frontend (required for the custom sidebar panel + Lovelace resources)
frontend:

# Enable HA's tag integration. It owns the `tag_scanned` event Home Keeper listens
# for, and its tag list is what the panel's tag picker offers, so both the tag-scan
# integration test and the panel need it loaded (this minimal config omits
# default_config, which would otherwise bring it in).
tag:

# A stand-in for a phone. The container has no companion app, so this notify group
# with no members gives the tests a real ``notify.mobile_app_test`` service. A send to
# it is accepted and goes nowhere. A target that does not exist is now reported as
# not sent (B16-9), so the notification tests need one that exists.
notify:
  - platform: group
    name: mobile_app_test
    services: []

# Enable the recorder. A real HA install always has it (via default_config); this
# minimal test config omits default_config, so without this the HA frontend's
# `recorder/info` probe at load is rejected as an unknown command and surfaces as an
# unhandled websocket rejection in the browser console. Enabling it keeps the e2e
# environment representative and the console clean.
recorder:

# A `device_class: problem` binary sensor, kept "on", so the problem-sensor sync
# (enabled via the home_keeper config entry's options) has something to mirror — it
# drives the seeded `task_sump_problem` synced task used by the screenshot capture
# and integration coverage. A unique_id registers it in the entity registry so the
# sync's enumeration can find it.
template:
  - binary_sensor:
      - name: "Sump pump problem"
        unique_id: sump_pump_problem
        device_class: problem
        state: "{{ true }}"
  # A *controllable* binary sensor for the state-mode sensor task, standing in for
  # the kind of "water tank low" / "battery almost empty" flag a device exposes.
  # Deliberately NOT device_class problem: those are already mirrored by the
  # problem-sensor sync, and the point of state mode is reaching the ones that
  # aren't. It follows an input_boolean so a test can flip it and produce a genuine
  # off -> on state-change event.
  - binary_sensor:
      - name: "HK demo water tank low"
        unique_id: hk_demo_water_tank_low
        device_class: moisture
        state: "{{ is_state('input_boolean.hk_demo_flag', 'on') }}"
  # A low-battery flag, kept "on", so a declarative companion that selects
  # device_class battery has one entity to match. The hand-built battery companion in
  # tests/integration/test_declarative_companion_sync.py and the
  # declarative-companions e2e spec both read "1 match" off this sensor. It is
  # always "on", so a companion that watches it arms on a condition that is already
  # true. Not device_class problem, so the problem-sensor sync leaves it alone.
  - binary_sensor:
      - name: "HK demo remote battery"
        unique_id: hk_demo_remote_battery
        device_class: battery
        state: "{{ true }}"
  # A fixed cumulative run-hours counter, standing in for the kind of
  # ``total_usage_hours`` sensor an appliance integration exposes. Constant so the
  # seeded usage task's progress ("120 of 300 h used") renders identically on every
  # screenshot run — unlike ``input_number.hk_demo_meter``, which the integration
  # tests drive up and down.
  - sensor:
      - name: "Demo printer hours"
        unique_id: demo_printer_hours
        unit_of_measurement: "h"
        state_class: total_increasing
        state: "{{ 780 }}"
  # Two parts that report the life they have left, in two different time units, so the
  # integration presets' time template can be rendered in a real Home Assistant (see
  # tests/integration/test_declarative_presets.py). 600 minutes is 10 hours, under the
  # 24-hour limit; 3 days is 72 hours, over it. Constant, so the verdicts are known.
  - sensor:
      - name: "HK demo filter time left"
        unique_id: hk_demo_filter_time_left
        unit_of_measurement: "min"
        device_class: duration
        state: "{{ 600 }}"
      - name: "HK demo brush time left"
        unique_id: hk_demo_brush_time_left
        unit_of_measurement: "d"
        device_class: duration
        state: "{{ 3 }}"
  # An update that is always available, so the bundled **Firmware update available**
  # declarative companion has one entity to match. The preset picker's preview and
  # the declarative-companions e2e spec both read "1 match" off it. This is the only
  # `update` entity in the fixture on purpose, so that count stays knowable. Both
  # versions are constant, so the entity reports "on" on every run and a screenshot
  # of it is deterministic.
  - update:
      - name: "HK demo router firmware"
        unique_id: hk_demo_router_firmware
        installed_version: "1.2.0"
        latest_version: "1.3.1"

# Dedicated YAML dashboard used by the Playwright e2e suite. The default
# (storage-mode) dashboard from onboarding is left untouched. The Home Keeper
# todo/calendar entities resolve via HA's built-in cards.
lovelace:
  mode: storage
  dashboards:
    home-keeper-e2e:
      mode: yaml
      title: Home Keeper E2E
      icon: mdi:home-clock
      show_in_sidebar: true
      filename: home-keeper-e2e.yaml

# Helpers + automation used by test_lifecycle to observe the
# home_keeper_task_completed event (the public cross-integration hook). The
# automation records the event's opaque source/origin so a REST test can assert the
# event fired with the right payload.
# A numeric helper the sensor-based-task integration test drives to exercise the
# sensor watcher: a threshold/usage task binds to it, and changing its value makes
# Home Keeper arm the task (see tests/integration/test_sensor_watcher.py).
input_number:
  hk_demo_meter:
    name: HK demo meter
    min: 0
    max: 1000000
    step: 1
    initial: 0

# Drives ``binary_sensor.hk_demo_water_tank_low`` above, so the state-mode sensor
# task test can flip a real binary sensor between off and on.
input_boolean:
  hk_demo_flag:
    name: HK demo flag

input_text:
  hk_last_completed_source:
    name: HK last completed source
    max: 255
  hk_last_completed_origin:
    name: HK last completed origin
    max: 255
  hk_last_low_stock_part:
    name: HK last low-stock part
    max: 255
  hk_last_uncompleted_ts:
    name: HK last uncompleted ts
    max: 255
  hk_last_event_entity_event:
    name: HK last event entity event
    max: 255

automation:
  # Uses the Event received trigger on the water heater's Home Keeper event entity,
  # so tests/integration/test_event_entities.py can show that an automation built in
  # the new trigger editor runs.
  - alias: Capture Home Keeper event entity
    triggers:
      - trigger: event.received
        target:
          entity_id: event.garage_water_heater_home_keeper_events
        options:
          event_type:
            - task_completed
            - part_low_stock
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.hk_last_event_entity_event
        data:
          value: >-
            {{ trigger.to_state.attributes.event_type }}:{{
            trigger.to_state.attributes.task_id
            | default(trigger.to_state.attributes.part_id) }}
  - alias: Capture Home Keeper task completed
    trigger:
      - platform: event
        event_type: home_keeper_task_completed
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.hk_last_completed_source
        data:
          value: "{{ trigger.event.data.source | tojson }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.hk_last_completed_origin
        data:
          value: "{{ trigger.event.data.origin if trigger.event.data.origin is not none else 'none' }}"
  - alias: Capture Home Keeper task uncompleted
    trigger:
      - platform: event
        event_type: home_keeper_task_uncompleted
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.hk_last_uncompleted_ts
        data:
          value: "{{ trigger.event.data.ts if trigger.event.data.ts is not none else 'none' }}"
  - alias: Capture Home Keeper part low stock
    trigger:
      - platform: event
        event_type: home_keeper_part_low_stock
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.hk_last_low_stock_part
        data:
          value: "{{ trigger.event.data.part_id }}@{{ trigger.event.data.stock }}"

# Minimal logging
logger:
  default: info
  logs:
    custom_components.home_keeper: debug
