---
# Home Keeper house rule. Do not open with why a reader should care.
# Start with the fact: "Home Keeper supports ...". See .amazonq/rules/writing-style.md.
extends: existence
message: "Motivational opener: '%s'. Start with the fact, not the reason to care."
level: error
ignorecase: true
tokens:
  - '\beasy to (?:forget|ignore|miss|lose)\b'
  - '\bnobody (?:can|wants|sees|checks)\b'
  - '\bis not a reminder\b'
  - '\bthe point\b'
  - '\bwhich is what it needed\b'
