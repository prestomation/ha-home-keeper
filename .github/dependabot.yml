version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: "/custom_components/home_keeper/frontend"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # TypeScript 7's native-rewrite release changed the shape of the `ts`
      # module namespace (e.g. `ts.ScriptTarget` enums), which crashes
      # @rollup/plugin-typescript@12.3.0 (the latest release as of this
      # writing) with "Cannot read properties of undefined (reading
      # 'ES2015')" during `rollup -c`. See PR #155 and the "TypeScript 7
      # upgrade" entry in IDEAS.md for the condition to remove this rule.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # The root vitest is the one Stryker drives. @stryker-mutator/vitest-runner
      # 10.0.0 runs no test per mutant under vitest 5, so every mutant survives and
      # the TypeScript mutation gate reads 0%. A dependency-only PR changes no
      # TypeScript, so its own mutation job has nothing to score and stays green
      # (#384). Remove this rule when a Stryker vitest runner supports vitest 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/ui"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # The Docusaurus site. This is the fourth npm project in the repository, and the
  # site build is a gate on every PR. No entry covered it, so its dependencies did
  # not get updates.
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # No CI job runs the site's `npm run typecheck`. docs-preview.yml runs
      # `npm run build`, and a Docusaurus build does not call `tsc`. A major
      # TypeScript bump would thus go through dependabot-auto-merge.yml with every
      # check green and no job having typechecked the site. Remove this rule when a
      # lane runs `npm run typecheck` in website/.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
