name: Walkthrough video — PR preview

# Capture the panel video walkthrough in CI as a *build artifact* (never committed)
# and surface it on the PR as a sticky comment. The gif/mp4 are published to the
# gh-pages branch under the `pr-preview-media/pr-<n>/` umbrella (served by GitHub
# Pages), so they embed in the comment without bloating the repo's git history. The
# preview is re-published on each push and removed when the PR closes.
#
# Capture is a *hard* gate. The capture step itself keeps continue-on-error so the
# log dump, the cleanup and the sticky comment all still run and say what went wrong;
# the final step then fails the check. Before that, a failed capture reported the job
# as green and left only a warning comment, and the tour sat broken across several
# PRs with every check passing. The reviewable artifact is the comment, not anything
# in the diff — if a UI change alters the tour, update
# tests/e2e/walkthrough.capture.ts so this regenerates correctly.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Read-only by default. Only the `publish` job gets a write token, and it runs no
# code from the PR: it downloads the media the `walkthrough` job built and pushes it
# to gh-pages. The `walkthrough` job runs `npm ci` and the PR's own capture scripts,
# so it must never hold a write token. Dependabot PRs are same-repo PRs and got the
# workflow's write token here, so a compromised dependency's install script could
# have pushed or cut a release before anyone reviewed the PR.
permissions:
  contents: read

concurrency:
  group: walkthrough-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # Build: capture the tour with a read-only token. The job name stays
  # `walkthrough`, because it is the hard gate on the capture.
  walkthrough:
    runs-on: ubuntu-latest
    # Forked PRs get no write token for `publish` — skip gracefully (same as the
    # docs preview). A closed PR has nothing to capture; `publish` removes the preview.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed'
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      capture: ${{ steps.capture.outcome }}
      walkthrough: ${{ steps.variants.outputs.walkthrough }}
      walkthrough_phone: ${{ steps.variants.outputs.walkthrough_phone }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # --ignore-scripts: no package in these lockfiles needs an install script
      # (fsevents is macOS-only), so none gets to run.
      - name: Install frontend deps
        run: npm ci --ignore-scripts --prefix custom_components/home_keeper/frontend

      - name: Build panel JS
        run: bash ci/build-panel.sh

      - name: Install e2e deps
        run: npm ci --ignore-scripts --prefix tests/e2e

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Home Assistant
        working-directory: tests/integration
        run: docker compose up -d

      - name: Wait for Home Assistant
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8123/api/ 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Home Assistant is responding (HTTP $code, attempt $i)"
              exit 0
            fi
            echo "Attempt $i/60 - HTTP $code - waiting..."
            sleep 2
          done
          echo "Home Assistant failed to start within 120s"
          (cd tests/integration && docker compose logs)
          exit 1

      - name: Capture walkthrough video
        id: capture
        continue-on-error: true
        env:
          # Output to a workspace dir, never docs/videos — nothing is committed.
          VIDEO_DIR: ${{ github.workspace }}/_walkthrough_out
        run: |
          bash ci/capture-video.sh
          # The intermediate WebM isn't published — only gif (embed) + mp4 (link).
          rm -f "$VIDEO_DIR"/*.webm

      # Which tours actually produced a gif. The two are independent tests, so one
      # can flake without the other; without this the comment would embed a broken
      # image next to a good one.
      - name: Note which tours were captured
        id: variants
        env:
          VIDEO_DIR: ${{ github.workspace }}/_walkthrough_out
        run: |
          for name in walkthrough walkthrough-phone; do
            key="$(echo "$name" | tr - _)"
            if [ -f "$VIDEO_DIR/$name.gif" ]; then
              echo "$key=yes" >> "$GITHUB_OUTPUT"
            else
              echo "$key=no" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Dump Home Assistant logs on capture failure
        if: steps.capture.outcome == 'failure'
        working-directory: tests/integration
        run: docker compose logs homeassistant

      - name: Cleanup Home Assistant
        if: always()
        working-directory: tests/integration
        run: docker compose down -v

      # Hand the media to `publish`. Only a good capture is uploaded, so `publish`
      # never deploys a partial set.
      - name: Upload the walkthrough media
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-media
          path: _walkthrough_out
          retention-days: 1
          if-no-files-found: error

      # The capture step above keeps `continue-on-error` so every diagnostic still
      # runs: the Home Assistant log dump, the container cleanup, the upload, and (in
      # `publish`) the sticky comment that says what failed. This step is what turns
      # a failed capture into a red check, so "all checks green" cannot mean "the
      # tour is broken". It stays in this job so the `walkthrough` check is the gate.
      #
      # A cancelled run is excluded for the same reason the sticky comment excludes
      # it: this job's concurrency group cancels in-progress runs, and a superseded
      # run must not report a failure for a capture nothing was wrong with.
      #
      # This reads `outcome == 'failure'`, so it only fires when the capture actually
      # ran and failed. Give the capture step an `if:` of its own and a skip makes
      # `outcome` 'skipped', which passes this gate silently — the exact hole the gate
      # exists to close. Gate on the skip too if the capture ever becomes conditional.
      - name: Fail the check when the capture failed
        if: ${{ !cancelled() && steps.capture.outcome == 'failure' }}
        run: |
          echo "::error::The walkthrough capture failed. See the sticky PR comment and the Playwright output above."
          exit 1

  # Publish: deploy (or remove) the preview and write the sticky comment. This job
  # holds the write token, so it runs no code from the PR: it checks out the base
  # commit only because the deploy action needs a checkout to work in, and the
  # media is the artifact `walkthrough` uploaded.
  publish:
    needs: walkthrough
    runs-on: ubuntu-latest
    # `!cancelled()` so this job runs when `walkthrough` failed (the comment says
    # the capture failed) and when it was skipped on a closed PR (remove the
    # preview). A run that a newer push cancelled stops here, see the comment step.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      !cancelled()
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download the walkthrough media
        if: github.event.action != 'closed' && needs.walkthrough.outputs.capture == 'success'
        uses: actions/download-artifact@v8
        with:
          name: walkthrough-media
          path: _walkthrough_out

      # Deploy on open/sync (when capture succeeded); remove on close. A separate
      # umbrella from the docs preview so the two don't fight over pr-<n>/.
      - name: Publish / remove preview
        if: github.event.action == 'closed' || needs.walkthrough.outputs.capture == 'success'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_walkthrough_out
          preview-branch: gh-pages
          umbrella-dir: pr-preview-media
          # We post our own comment with the embedded gif below.
          comment: false

      - name: Sticky comment with the walkthrough
        # `!cancelled()` rather than `always()`: this job's concurrency group cancels
        # in-progress runs, so two pushes a few minutes apart cancel the first one
        # mid-capture. Under `always()` that cancelled run still reaches this step,
        # reads a non-success outcome and overwrites a perfectly good embed with a
        # "capture failed" note — for a run nothing was wrong with, while the gif it
        # is contradicting is still published and live. The superseding run posts the
        # real result a couple of minutes later.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          CAPTURE_OUTCOME: ${{ needs.walkthrough.outputs.capture }}
          HAS_DESKTOP: ${{ needs.walkthrough.outputs.walkthrough }}
          HAS_PHONE: ${{ needs.walkthrough.outputs.walkthrough_phone }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- walkthrough-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const n = context.issue.number;
            const action = process.env.EVENT_ACTION;
            const outcome = process.env.CAPTURE_OUTCOME;

            // GitHub Pages serves the project site at <owner>.github.io/<repo>/ (owner lowercased).
            const base = `https://${owner.toLowerCase()}.github.io/${repo}/pr-preview-media/pr-${n}`;
            const gif = `${base}/walkthrough.gif`;
            const mp4 = `${base}/walkthrough.mp4`;
            const gifPhone = `${base}/walkthrough-phone.gif`;
            const mp4Phone = `${base}/walkthrough-phone.mp4`;

            let body;
            if (action === 'closed') {
              // Preview was torn down; leave a tombstone rather than a broken image.
              body = [marker, '### 🎥 Panel walkthrough', '', '_Preview removed — the PR is closed._'].join('\n');
            } else if (outcome === 'success') {
              const lines = [marker, '### 🎥 Panel walkthrough', ''];
              if (process.env.HAS_DESKTOP === 'yes') {
                lines.push(
                  `<img src="${gif}" alt="Home Keeper panel walkthrough" width="820">`,
                  '',
                  `▶️ [Higher-quality MP4](${mp4})`,
                  '',
                );
              }
              if (process.env.HAS_PHONE === 'yes') {
                lines.push(
                  '#### On a phone',
                  '',
                  `<img src="${gifPhone}" alt="Home Keeper panel walkthrough on a phone" width="300">`,
                  '',
                  `▶️ [Higher-quality MP4](${mp4Phone})`,
                  '',
                );
              }
              lines.push(
                'Auto-generated from this PR\'s HEAD by `walkthrough-preview.yml` — updated on every push, removed when the PR closes. (A committed `<video>` tag is stripped by GitHub\'s sanitizer, so the gif carries the motion and the mp4 is linked.)',
              );
              body = lines.join('\n');
            } else {
              body = [
                marker,
                '### 🎥 Panel walkthrough',
                '',
                `⚠️ The walkthrough capture failed for this push — see the [run logs](${process.env.RUN_URL}). This check is red until the tour runs clean: fix the tour, or push again if it was a flake.`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: n });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
            }
