name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check custom_components tests ci
      - name: Ruff format check
        run: ruff format --check custom_components tests ci

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must be at or above Home Assistant's own Python floor (>=3.14.2 since HA
      # 2026.3), otherwise pip backtracks to the last HA that supported this
      # version instead of failing, and the gate silently checks a stale API.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Install Home Assistant so its own types resolve — strict typing against the
      # real HA API is the Platinum quality-scale gate (quality_scale.yaml). Also
      # install the integration's own runtime requirements (manifest.json) so their
      # imports resolve too.
      - name: Install mypy + Home Assistant + integration requirements
        run: pip install mypy homeassistant Babel types-PyYAML
      - name: Report and verify the Home Assistant version being checked
        run: python ci/check-ha-version.py
      - name: Mypy (strict typing)
        run: mypy custom_components/home_keeper
      # The published JSON Schema is converted from the integration's own voluptuous
      # service schemas, so its gate needs a Home Assistant new enough to import the
      # integration. That rules out the unit lane, whose Home Assistant is whatever pip
      # backtracked to for its Python. It runs here, on every PR, rather than in the
      # path-filtered docs workflow: a change to models.build_task can drift the schema
      # without touching a docs path.
      - name: Install the schema gate's own dependencies
        # voluptuous-openapi goes in under Home Assistant's constraints, because the
        # version is Home Assistant's to choose — see ci/install-schema-deps.sh.
        run: |
          pip install pytest PyYAML jsonschema
          bash ci/install-schema-deps.sh
      - name: Published document schema matches the code
        # HK_SCHEMA_GATE opts the file in; it is unset everywhere else, so the skip
        # there is deliberate rather than accidental. The grep is what stops this
        # becoming a gate that silently never runs.
        env:
          HK_SCHEMA_GATE: "1"
        run: |
          python -m pytest tests/unit/test_generate_schema.py -v | tee /tmp/schema.log
          grep -qE "[0-9]+ passed" /tmp/schema.log
          if grep -qE "[0-9]+ skipped" /tmp/schema.log; then
            echo "::error::the schema gate skipped instead of running"; exit 1
          fi

  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # errata-ai renamed this org to vale-cli; SHA-pinned to v3.0.0.
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          fail_on_error: true
          # v3.0.0 changed fail_on_error to fail only on `error`-severity
          # findings (previously any severity). fail_level: any restores the
          # old, stricter behavior this gate relies on.
          fail_level: any
          reporter: github-pr-review
          filter_mode: added

  changelog-release-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ci/check-changelog-release-gap.py needs the base branch's history and
          # every release tag to tell an already-shipped section from one still
          # being iterated.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Guard against editing an already-released CHANGELOG section
        run: python3 ci/check-changelog-release-gap.py
