name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # jsdom 30 (bumped in #171) requires Node's worker_threads.markAsUncloneable,
          # which only exists from ^22.22.2 || ^24.15.0 || >=26.0.0 (jsdom's own
          # `engines` floor) — Node 20 makes `require('jsdom')` throw before any test
          # runs. Keep this at or above jsdom's floor whenever jsdom is bumped again.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bash ci/install-deps.sh

      - name: Build panel JS
        run: bash ci/build-panel.sh

      - name: Run frontend tests
        run: bash ci/test-frontend.sh

      - name: Run Python unit tests
        run: bash ci/test-python-unit.sh

      - name: Translation coverage report
        if: always()
        run: python3 ci/i18n-coverage.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Clean node_modules before validation
        run: rm -rf custom_components/home_keeper/frontend/node_modules

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Run hassfest
        uses: "home-assistant/actions/hassfest@master"
