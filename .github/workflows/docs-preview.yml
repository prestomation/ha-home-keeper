name: Docs site — PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'website/**'
      # Canonical doc sources: the site content is generated from these, so a
      # change here changes the rendered pages (see website/scripts/sync-docs.mjs).
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      # The API reference page is generated from the integration itself
      # (ci/generate_api_docs.py), so a PR that only adds a service or an event
      # still changes a doc page.
      - 'custom_components/home_keeper/api_surface.py'
      - 'custom_components/home_keeper/services.yaml'
      - 'custom_components/home_keeper/strings.json'
      - 'ci/generate_api_docs.py'
      # The published JSON Schema is converted from the integration's own service
      # schemas and the document's record shapes, so a change to either changes the
      # file the site serves (ci/generate_schema.py).
      - 'custom_components/home_keeper/__init__.py'
      - 'custom_components/home_keeper/transfer.py'
      - 'ci/generate_schema.py'
      - '.github/workflows/docs-preview.yml'

# Previews deploy to pr-preview/pr-<n>/ on the gh-pages branch and two sticky
# comments are posted on the PR: the preview URL (pr-preview-action) and a list
# of deep links to the doc pages this PR changed (changed-pages.mjs).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Forked PRs cannot get a preview (no write token); skip them gracefully.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the PR base so we can diff which docs changed.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm run sync` renders the API reference with ci/generate_api_docs.py and the
      # published JSON Schema with ci/generate_schema.py before Docusaurus builds.
      # The schema is converted from the integration's own voluptuous service schemas,
      # which are written in Home Assistant validators — so unlike the API reference,
      # this one needs Home Assistant installed. That is why the Python here must be at
      # or above HA's own floor (>=3.14.2 since HA 2026.3): below it, pip backtracks to
      # an ancient HA instead of failing, and the schema would be built from an API
      # nobody runs (#199).
      - uses: actions/setup-python@v7
        if: github.event.action != 'closed'
        with:
          python-version: "3.14"

      - name: Install
        if: github.event.action != 'closed'
        working-directory: website
        run: |
          pip install PyYAML homeassistant Babel
          npm ci

      - name: Report and verify the Home Assistant version being used
        if: github.event.action != 'closed'
        run: python ci/check-ha-version.py

      - name: Install the schema generator's converter, as Home Assistant pins it
        if: github.event.action != 'closed'
        run: bash ci/install-schema-deps.sh

      - name: Build
        if: github.event.action != 'closed'
        working-directory: website
        env:
          DOCS_BASE_URL: /ha-home-keeper/pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: website/build
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Compute changed doc pages
        id: changed
        if: github.event.action != 'closed'
        env:
          PREVIEW_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Files this PR changed (three-dot: since divergence from base).
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed.txt
          # Base version of the README so section-level changes can be detected.
          git show "$BASE_SHA:README.md" > /tmp/readme-base.md 2>/dev/null || true
          CHANGED_FILES="$(cat /tmp/changed.txt)" \
          README_BASE=/tmp/readme-base.md \
          README_HEAD=README.md \
            node website/scripts/changed-pages.mjs > /tmp/changed-pages.md
          if grep -q '^- \[' /tmp/changed-pages.md; then
            echo "has_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing changed-pages comment
        id: find
        if: github.event.action != 'closed'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- doc-preview-changed-pages -->'

      # Post the list when pages changed, or update an existing comment to "none"
      # if a later push removed all doc changes. Skip entirely otherwise.
      - name: Post changed-pages comment
        if: >
          github.event.action != 'closed' &&
          (steps.changed.outputs.has_pages == 'true' ||
           steps.find.outputs.comment-id != '')
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          body-path: /tmp/changed-pages.md
          edit-mode: replace
