name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    # The stable lane keeps the name `integration`, so a required check still matches.
    name: ${{ matrix.ha == 'stable' && 'integration' || format('integration (HA {0})', matrix.ha) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, oldest]
    # The tier runs a real Home Assistant container and several tests that wait out
    # a hold or a coordinator tick, so it takes ~9.5 minutes at main HEAD. A 10
    # minute cap cancelled a run whose 216 tests had all passed, and a cancelled run
    # reads as a red check. 20 gives the tier room to grow before the cap is the
    # thing that fails a PR again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # HA_TAG is the Docker image tag. The oldest lane reads ci/oldest-ha.env.
      - name: Choose the Home Assistant version
        run: |
          if [ "${{ matrix.ha }}" = "oldest" ]; then
            . ci/oldest-ha.env
            echo "HA_TAG=$OLDEST_HA" >> "$GITHUB_ENV"
          else
            echo "HA_TAG=${{ matrix.ha }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: custom_components/home_keeper/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix custom_components/home_keeper/frontend

      - name: Build panel JS
        run: bash ci/build-panel.sh

      - name: Start Home Assistant
        working-directory: tests/integration
        run: docker compose up -d

      - name: Wait for Home Assistant to start
        run: |
          echo "Waiting for Home Assistant..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8123/api/ 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Home Assistant is responding (HTTP $code, attempt $i)"
              exit 0
            fi
            echo "Attempt $i/60 - HTTP $code - waiting..."
            sleep 2
          done
          echo "Home Assistant failed to start within 120s"
          (cd tests/integration && docker compose logs)
          exit 1

      - name: Show the Home Assistant version
        continue-on-error: true
        working-directory: tests/integration
        run: docker compose exec -T homeassistant python -c "from homeassistant.const import __version__; print('HA', __version__)"

      - name: Run integration tests
        run: bash ci/test-python-integration.sh

      - name: Dump Home Assistant logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose logs homeassistant

      - name: Cleanup
        if: always()
        working-directory: tests/integration
        run: docker compose down -v

  noise:
    # The noise budget (tests/noise): how many logbook rows, unavailable flips,
    # events, store writes and reloads each action makes, against
    # tests/noise/baseline.json. Issue #467 filled users' logbooks and no test saw it.
    # It runs in parallel with `integration` on its own Home Assistant, about 8
    # minutes of scenarios. It needs no panel build: it reads no frontend.
    name: Noise budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run the noise-budget scenarios
        run: bash ci/test-noise.sh

  upgrade:
    # The upgrade suite boots a pre-split Home Assistant (2026.7) with the last
    # Home Keeper it ran, then the current stable with this tree, against one config
    # dir. Only the nightly beta run had it, so #403 changed the split repair and
    # merged without it, and the nightly found the duplicate it left (#417). It runs
    # in parallel with `integration` and is shorter, so it adds no wait to a PR.
    name: Upgrade 2026.7 -> stable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: custom_components/home_keeper/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix custom_components/home_keeper/frontend

      # Stages the real glue integrations at pinned SHAs plus the upstream stubs.
      - name: Stage glue integrations
        run: bash ci/fetch-glues.sh

      # HA_TAG is unset, so the new Home Assistant is `stable`.
      - name: Run upgrade suite
        run: python -m pytest tests/upgrade -v -rxX
