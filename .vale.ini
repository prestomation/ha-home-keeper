[custom_components/home_keeper/strings.json]
BasedOnStyles = ai-tells, HomeKeeper
# "actionable" (as in "actionable notification") is Home Assistant's own term for
# a mobile notification with action buttons, used throughout this codebase
# (README, CHANGELOG, notifier.py) as an established feature name, not AI filler.
ai-tells.OverusedVocabulary = NO

[custom_components/home_keeper/services.yaml]
BasedOnStyles = ai-tells, HomeKeeper
# YAML's unquoted `key: Value` mapping syntax trips this rule on every field.
# Confirmed empirically: 244/345 hits in the structured-string tier were this,
# all here, none in the JSON files. Real prose colons still get EmDash/Semicolon/
# LabelAndExplain/etc coverage. Only the key-syntax false positive is silenced.
ai-tells.ColonUsage = NO
# Same "actionable notification" justification as strings.json above.
ai-tells.OverusedVocabulary = NO
# YAML's `>-` folded block scalars don't terminate Vale's sentence tokenizer
# reliably at field boundaries, so this rule's reported hits can start inside
# one field's description but match content several fields later (verified by
# hand: e.g. a hit reported at the origin field's description actually resolved
# to a genuine tricolon in skip_task's, several keys down). Manually inspected
# every hit in this file: exactly one real tricolon existed (skip_task), and it's
# fixed directly in the prose. The rest were this fusion artifact.
ai-tells.VerbTricolon = NO

